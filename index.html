<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffd4e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>오늘의 나</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="상단 메뉴">
      <button class="icon-button star-button" type="button" aria-label="별 개수">
        <span class="star">⭐</span>
        <span id="starCount">0</span>
      </button>
      <button class="icon-button profile-button" type="button" aria-label="프로필">👤</button>
    </header>

    <main class="home">
      <section class="hero" aria-labelledby="appTitle">
        <p class="eyebrow">오늘도 반짝이는 우리 아이</p>
        <h1 id="appTitle">오늘의 나</h1>
        <p class="subtitle">사진을 골라 오늘의 모습을 남겨보세요</p>
      </section>

      <section class="children" aria-label="아이 선택">
        <article class="child-card daughter-card">
          <div class="decor decor-one">✦</div>
          <div class="decor decor-two">♡</div>
          <div class="avatar daughter-avatar" aria-hidden="true">
            <div class="avatar-face">👧🏻</div>
          </div>
          <div class="child-copy">
            <span class="child-label">우리 딸</span>
            <h2>박하린</h2>
            <p>하린이의 오늘을 예쁘게 기록해요</p>
          </div>
          <div class="actions">
            <button class="action-button camera" type="button" data-child="박하린" data-mode="camera">
              <span>📷</span><strong>카메라</strong>
            </button>
            <button class="action-button album" type="button" data-child="박하린" data-mode="album">
              <span>🖼️</span><strong>앨범</strong>
            </button>
          </div>
        </article>

        <article class="child-card son-card">
          <div class="decor decor-one">✦</div>
          <div class="decor decor-two">☆</div>
          <div class="avatar son-avatar" aria-hidden="true">
            <div class="avatar-face">👦🏻</div>
          </div>
          <div class="child-copy">
            <span class="child-label">우리 아들</span>
            <h2>박서율</h2>
            <p>서율이의 오늘을 멋지게 기록해요</p>
          </div>
          <div class="actions">
            <button class="action-button camera" type="button" data-child="박서율" data-mode="camera">
              <span>📷</span><strong>카메라</strong>
            </button>
            <button class="action-button album" type="button" data-child="박서율" data-mode="album">
              <span>🖼️</span><strong>앨범</strong>
            </button>
          </div>
        </article>
      </section>
    </main>

    <p class="version">오늘의 나 V4.1</p>
  </div>

  <input id="cameraInput" class="hidden-input" type="file" accept="image/*" capture="environment">
  <input id="albumInput" class="hidden-input" type="file" accept="image/*">

  <div id="previewModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <button class="modal-close" type="button" aria-label="닫기" data-close-modal>×</button>
      <p class="modal-kicker">사진 선택 완료</p>
      <h2 id="previewTitle">오늘의 사진</h2>
      <div class="preview-frame">
        <img id="previewImage" alt="선택한 사진 미리보기">
      </div>
      <p id="previewMessage" class="preview-message"></p>
      <button id="confirmPhoto" class="confirm-button" type="button">이 사진으로 시작하기</button>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./script.js"></script>
</body>
</html>
