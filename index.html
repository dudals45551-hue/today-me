<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8b6cf">
<title>오늘의 나</title>
<link rel="manifest" href="./manifest.json?v=42">
<link rel="icon" href="./icons/icon.svg?v=42" type="image/svg+xml">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#4b3a42}
body{background:#f8eef3}
button{font:inherit}
.app{min-height:100svh;overflow:hidden}
.topbar{position:fixed;z-index:20;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 18px 8px;display:flex;justify-content:space-between;pointer-events:none}
.topbar button{pointer-events:auto;border:0;background:rgba(255,255,255,.9);border-radius:999px;min-height:48px;padding:8px 15px;box-shadow:0 7px 18px rgba(75,58,66,.15);font-weight:800;font-size:22px}
.screen{display:none;min-height:100svh;padding:calc(84px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));position:relative}
.screen.active{display:block}
.selector{background:linear-gradient(90deg,#ffd7e6 0 50%,#dceeff 50% 100%)}
.hero{text-align:center;margin-bottom:22px}
.hero .mini{display:inline-block;padding:7px 13px;background:rgba(255,255,255,.72);border-radius:999px;font-size:13px;font-weight:800}
.hero h1{font-size:48px;margin:14px 0 6px;letter-spacing:-2px}
.hero p{margin:0;font-weight:700;color:#685962}
.child-grid{display:grid;gap:16px;max-width:680px;margin:auto}
.child-select{border:0;background:rgba(255,255,255,.93);border-radius:28px;padding:16px;box-shadow:0 16px 40px rgba(70,55,72,.16);display:grid;grid-template-columns:104px 1fr;gap:14px;text-align:left;align-items:center}
.child-select img{width:104px;height:132px;object-fit:cover;border-radius:24px}
.child-select h2{margin:0 0 5px;font-size:30px}
.child-select p{margin:0;color:#766771;font-weight:700;line-height:1.45}
.daughter-select{outline:3px solid rgba(255,132,176,.18)}
.son-select{outline:3px solid rgba(104,174,247,.18)}

.theme{background-size:cover;background-position:center;isolation:isolate}
.theme::before{content:"";position:absolute;inset:0;z-index:-2}
.theme::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.78) 58%,rgba(255,255,255,.96))}
.harin{background-image:url("./images/harin.jpg")}
.harin::before{background:linear-gradient(180deg,rgba(255,171,204,.25),rgba(255,215,230,.82))}
.seoyul{background-image:url("./images/seoyul.jpg")}
.seoyul::before{background:linear-gradient(180deg,rgba(132,190,255,.24),rgba(218,238,255,.84))}
.theme-header{text-align:center;padding-top:8px}
.theme-header .role{font-weight:900;font-size:20px}
.theme-header h1{font-size:47px;margin:5px 0 6px;text-shadow:0 3px 0 rgba(255,255,255,.7)}
.theme-header p{margin:0;font-weight:800}
.photo-card{width:min(74vw,340px);aspect-ratio:3/4;margin:20px auto 16px;border-radius:34px;overflow:hidden;border:8px solid rgba(255,255,255,.9);box-shadow:0 18px 40px rgba(67,54,66,.24)}
.photo-card img{width:100%;height:100%;object-fit:cover}
.menu{display:grid;gap:11px;max-width:480px;margin:auto}
.menu button{border:0;border-radius:20px;min-height:58px;color:white;font-weight:900;font-size:19px;box-shadow:0 8px 18px rgba(70,55,72,.16)}
.harin .menu button:nth-child(1){background:#f06b9d}.harin .menu button:nth-child(2){background:#9278df}.harin .menu button:nth-child(3){background:#f4c84e}.harin .menu button:nth-child(4){background:#5cc3ae}.harin .menu button:nth-child(5){background:#62a9e9}
.seoyul .menu button:nth-child(1){background:#56a7ed}.seoyul .menu button:nth-child(2){background:#6f8ee8}.seoyul .menu button:nth-child(3){background:#f2b84b}.seoyul .menu button:nth-child(4){background:#57b9b0}.seoyul .menu button:nth-child(5){background:#7799d9}
.back{position:absolute;left:18px;top:calc(83px + env(safe-area-inset-top));z-index:5;border:0;background:rgba(255,255,255,.9);width:46px;height:46px;border-radius:50%;font-size:24px;box-shadow:0 7px 17px rgba(70,55,72,.15)}
.hidden{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(25px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#342b30;color:white;padding:12px 16px;border-radius:999px;font-weight:800;white-space:nowrap;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;padding:16px}.backdrop{position:absolute;inset:0;background:rgba(30,25,32,.58)}.sheet{position:relative;z-index:1;background:white;width:min(100%,520px);border-radius:28px;padding:20px}.sheet h2{margin:0 0 14px}.preview{aspect-ratio:4/5;overflow:hidden;border-radius:20px;background:#eee}.preview img{width:100%;height:100%;object-fit:cover}.close{position:absolute;right:12px;top:10px;border:0;border-radius:50%;width:40px;height:40px;font-size:25px}.confirm{width:100%;min-height:55px;border:0;border-radius:18px;background:linear-gradient(135deg,#f06b9d,#5da8ef);color:white;font-weight:900;font-size:18px;margin-top:14px}
@media(min-width:700px){.child-grid{grid-template-columns:1fr 1fr}.theme{padding-left:calc((100vw - 680px)/2);padding-right:calc((100vw - 680px)/2)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<button id="stars">⭐ <span id="starCount">0</span></button>
<button id="settings">⚙️</button>
</header>

<section id="selector" class="screen selector active">
<div class="hero"><span class="mini">오늘도 반짝이는 우리 아이</span><h1>오늘의 나</h1><p>누구의 오늘을 기록할까요?</p></div>
<div class="child-grid">
<button class="child-select daughter-select" data-open="harin"><img src="./images/harin.jpg" alt="하린"><div><h2>박하린</h2><p>공주님처럼 반짝이는 오늘을 남겨요</p></div></button>
<button class="child-select son-select" data-open="seoyul"><img src="./images/seoyul.jpg" alt="서율"><div><h2>박서율</h2><p>멋진 왕자님의 오늘을 기록해요</p></div></button>
</div>
</section>

<section id="harin" class="screen theme harin">
<button class="back" data-back>←</button>
<div class="theme-header"><div class="role">우리 딸</div><h1>오늘의 나</h1><p>안녕! 오늘은 어떤 스타일로 변신할까? 💗</p></div>
<div class="photo-card"><img src="./images/harin.jpg" alt="박하린"></div>
<div class="menu">
<button data-action="photo" data-child="박하린">📷 사진 찍기</button>
<button data-action="decorate" data-child="박하린">👗 캐릭터 꾸미기</button>
<button data-action="stars" data-child="박하린">⭐ 별 모으기</button>
<button data-action="closet" data-child="박하린">📖 나의 옷장</button>
<button data-action="letter" data-child="박하린">💌 아빠의 편지</button>
</div>
</section>

<section id="seoyul" class="screen theme seoyul">
<button class="back" data-back>←</button>
<div class="theme-header"><div class="role">우리 아들</div><h1>오늘의 나</h1><p>안녕! 오늘은 어떤 모습으로 변신할까? 💙</p></div>
<div class="photo-card"><img src="./images/seoyul.jpg" alt="박서율"></div>
<div class="menu">
<button data-action="photo" data-child="박서율">📷 사진 찍기</button>
<button data-action="decorate" data-child="박서율">🦸 캐릭터 꾸미기</button>
<button data-action="stars" data-child="박서율">⭐ 별 모으기</button>
<button data-action="closet" data-child="박서율">📖 나의 옷장</button>
<button data-action="letter" data-child="박서율">💌 아빠의 편지</button>
</div>
</section>
</div>

<input id="camera" class="hidden" type="file" accept="image/*" capture="environment">
<div id="modal" class="modal" hidden><div class="backdrop" data-close></div><div class="sheet"><button class="close" data-close>×</button><h2 id="modalTitle">오늘의 사진</h2><div class="preview"><img id="preview" alt="선택한 사진"></div><button class="confirm" id="confirm">이 사진으로 시작하기</button></div></div>
<div id="toast" class="toast"></div>

<script>
(()=>{
const screens=[...document.querySelectorAll('.screen')],toast=document.getElementById('toast'),camera=document.getElementById('camera'),modal=document.getElementById('modal'),preview=document.getElementById('preview'),modalTitle=document.getElementById('modalTitle');
let currentChild='',objUrl='';
function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));scrollTo(0,0)}
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2200)}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('selector'));
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{currentChild=b.dataset.child;const a=b.dataset.action;if(a==='photo'){camera.value='';camera.click()}else if(a==='stars'){say('별 모으기 기능은 다음 버전에서 연결해요 ⭐')}else if(a==='decorate'){say('캐릭터 꾸미기 화면을 다음 버전에 연결해요')}else if(a==='closet'){say('나의 옷장을 준비 중이에요')}else if(a==='letter'){say('아빠의 편지 기능을 준비 중이에요')}})
camera.onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(f);preview.src=objUrl;modalTitle.textContent=currentChild+'의 오늘';modal.hidden=false}
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>modal.hidden=true);
document.getElementById('confirm').onclick=()=>{modal.hidden=true;say(currentChild+' 사진 등록 완료!')};
document.getElementById('stars').onclick=()=>say('현재 별은 '+document.getElementById('starCount').textContent+'개예요');
document.getElementById('settings').onclick=()=>say('설정 화면은 준비 중이에요 ⚙️');
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=42').catch(()=>{}));
})();
</script>
</body>
</html>
